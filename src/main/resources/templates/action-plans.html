<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>액션플랜 — JobPuzzle</title>
<th:block th:replace="~{fragments/head :: dsCss}"></th:block>
<link rel="stylesheet" href="/css/ds/action-plans.css" th:href="@{/css/ds/action-plans.css}">
</head>
<body class="app">

<div th:replace="~{fragments/header :: appHeader('actionPlans')}"></div>

<main class="dash-wrap">
  <div class="phead">
    <div>
      <p class="phead__eyebrow">ACTION PLAN</p>
      <h1 class="phead__title">액션플랜</h1>
      <p class="phead__sub">지원 분석에서 찾은 보완 과제를 하나씩 끝내요. 과제 내용은 분석 결과 그대로이고, 마감일과 완료만 관리해요.</p>
    </div>
    <a href="/jobpuzzle/interview" th:href="@{/interview}" class="dbtn dbtn--navy"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>새 분석 시작하기</a>
  </div>

  <section class="ap-stats" aria-label="진행 현황">
    <div class="dcard ap-stat"><p class="ap-stat__label">전체 과제</p><p class="ap-stat__value" data-stat="total"></p></div>
    <div class="dcard ap-stat"><p class="ap-stat__label">남은 과제</p><p class="ap-stat__value" data-stat="pending"></p></div>
    <div class="dcard ap-stat"><p class="ap-stat__label">마감 지난 과제</p><p class="ap-stat__value ap-stat__value--danger" data-stat="over"></p></div>
    <div class="dcard ap-stat"><p class="ap-stat__label">전체 진행률</p><p class="ap-stat__value" data-stat="rate"></p><div class="ap-bar"><i data-stat="bar"></i></div></div>
  </section>

  <div class="toolbar">
    <div class="chips" role="group" aria-label="완료 상태">
      <button type="button" class="chip" data-filter="ALL" aria-pressed="true">전체</button>
      <button type="button" class="chip" data-filter="PENDING" aria-pressed="false">할 일</button>
      <button type="button" class="chip" data-filter="DONE" aria-pressed="false">완료</button>
    </div>
    <span class="seg" role="group" aria-label="보기 방식"><button type="button" data-view="list" aria-pressed="true">분석별 목록</button><button type="button" data-view="cal" aria-pressed="false">달력</button></span>
  </div>

  <div id="ap-list" aria-live="polite"></div>
  <div class="ap-cal" id="ap-cal" hidden>
    <div class="dcard" id="cal"></div>
    <aside class="dcard" id="cal-side" aria-live="polite"></aside>
  </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="/js/routes.js" th:src="@{/js/routes.js}"></script>
<script src="/js/common.js" th:src="@{/js/common.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/ds-ui.js" th:src="@{/js/ds-ui.js}"></script>
<script src="/js/action-plans.js" th:src="@{/js/action-plans.js}"></script>
</body>
</html>
