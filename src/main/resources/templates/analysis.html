<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지원 분석 — JobPuzzle</title>
<th:block th:replace="~{fragments/head :: dsCss}"></th:block>
<link rel="stylesheet" href="/css/ds/analysis.css" th:href="@{/css/ds/analysis.css}">
</head>
<body class="app">

<div th:replace="~{fragments/header :: appHeader('interview')}"></div>

<main class="dash-wrap">
  <div class="phead">
    <div>
      <p class="phead__eyebrow">JOB FIT ANALYSIS</p>
      <h1 class="phead__title">지원 분석</h1>
      <p class="phead__sub">채용공고의 요구사항과 내 자료를 하나씩 맞춰보고, 면접에서 물어볼 질문을 만들어요.</p>
    </div>
  </div>
  <div class="an-grid">
    <section class="dcard" id="analysis-root" th:attr="data-analysis-case-id=${analysisCaseId}" aria-live="polite" aria-busy="true"></section>
    <aside class="dcard an-side">
      <h3>분석에 쓰는 자료</h3>
      <dl class="an-mat" id="analysis-sources"></dl>
    </aside>
  </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="/js/routes.js" th:src="@{/js/routes.js}"></script>
<script src="/js/common.js" th:src="@{/js/common.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/ds-ui.js" th:src="@{/js/ds-ui.js}"></script>
<script src="/js/document-flow.js" th:src="@{/js/document-flow.js}"></script>
<script src="/js/analysis.js" th:src="@{/js/analysis.js}"></script>
</body>
</html>
