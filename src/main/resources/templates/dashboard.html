<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 — JobPuzzle</title>
<th:block th:replace="~{fragments/head :: dsCss}"></th:block>
<link rel="stylesheet" href="/css/v2/dashboard.css" th:href="@{/css/v2/dashboard.css}">
</head>
<body class="app r2-body">

<div th:replace="~{fragments/header :: appHeader('dashboard')}"></div>

<!-- 공용 도형: 준비 단계 조각(왼쪽 홈·오른쪽 돌기), 작은 퍼즐 조각, 화살표, 체크 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="link" d="M0 0 H100 V32 A16 16 0 1 1 100 68 V100 H0 V68 A16 16 0 1 0 0 32 Z"/>
    <symbol id="pc" viewBox="34 6 160 160">
      <path d="M46,40 H82 C86,40 88,37 86,33 C82,26 84,12 100,12 C116,12 118,26 114,33 C112,37 114,40 118,40 H154 Q160,40 160,46 V82 C160,86 163,88 167,86 C174,82 188,84 188,100 C188,116 174,118 167,114 C163,112 160,114 160,118 V154 Q160,160 154,160 H118 C114,160 112,157 114,153 C118,146 116,132 100,132 C84,132 82,146 86,153 C88,157 86,160 82,160 H46 Q40,160 40,154 V118 C40,114 43,112 47,114 C54,118 68,116 68,100 C68,84 54,82 47,86 C43,88 40,86 40,82 V46 Q40,40 46,40 Z"/>
    </symbol>
    <symbol id="arrow" viewBox="0 0 16 16"><path d="M2 8h11.5M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="tick" viewBox="0 0 12 12"><path d="M2 6.2 4.8 9 10 3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  </defs>
</svg>

<main class="r2 page">
  <div class="wrap">
    <div class="head dash-head">
      <div>
        <h1 class="title" id="dash-title">나의 준비 현황</h1>
        <p class="lead">오늘도 면접을 위해 한 조각씩 맞춰 갑니다.</p>
      </div>
      <dl class="job">
        <dt>희망 직무</dt>
        <dd id="dash-job">불러오는 중</dd>
        <div class="links"><a class="link" href="/jobpuzzle/settings" th:href="@{/settings}">수정</a><a class="link" href="/jobpuzzle/my-data" th:href="@{/my-data}">내 자료 확인하기</a></div>
      </dl>
    </div>

    <!-- 다음 할 일 + 준비 6단계 -->
    <section class="now" aria-label="다음 할 일과 준비 단계">
      <div class="paper next" id="dash-next"></div>
      <div class="steps">
        <p class="label">준비 단계 <b class="num" data-steps-count></b> / 6 완료</p>
        <svg class="chain" viewBox="-2 -2 620 104" role="img" data-chain></svg>
        <ol class="step-names" data-steps></ol>
        <p class="step-mobile" data-step-mobile></p>
      </div>
    </section>

    <!-- 요약 -->
    <dl class="tally" aria-label="요약">
      <div><dt>진행 중인 면접</dt><dd class="num"><span data-stat="active">0</span><small>건</small></dd></div>
      <div><dt>완료한 면접</dt><dd class="num"><span data-stat="done">0</span><small>건</small></dd></div>
      <div data-late><dt>마감 지난 과제</dt><dd class="num"><span data-stat="overdue">0</span><small>건</small></dd></div>
      <div><dt>마감일 없는 과제</dt><dd class="num"><span data-stat="nodue">0</span><small>건</small></dd></div>
    </dl>

    <!-- 탭 -->
    <div class="tabs" role="tablist" aria-label="준비 기록">
      <button role="tab" id="tab-sessions" aria-controls="p-sessions" aria-selected="true" data-tab="sessions">면접 세션<small class="num" data-count="sessions"></small></button>
      <button role="tab" id="tab-tasks" aria-controls="p-tasks" aria-selected="false" tabindex="-1" data-tab="tasks">과제<small class="num" data-count="tasks"></small></button>
    </div>

    <section class="panel" id="p-sessions" role="tabpanel" aria-labelledby="tab-sessions">
      <div class="group">
        <div class="group-head"><h2 class="h3">진행 중인 면접</h2></div>
        <ul class="rows sessions" data-list="doing"></ul>
      </div>
      <div class="group">
        <div class="group-head"><h2 class="h3">완료된 면접</h2><a class="link" href="/jobpuzzle/reports" th:href="@{/reports}">리포트 전체 보기<svg class="arrow" aria-hidden="true"><use href="#arrow"/></svg></a></div>
        <ul class="rows sessions" data-list="done"></ul>
      </div>
    </section>

    <section class="panel" id="p-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden>
      <div class="group">
        <div class="group-head">
          <h2 class="h3">과제 목록</h2>
          <div class="view" role="group" aria-label="보기 방식"><button type="button" aria-pressed="true" data-view="list">목록</button><button type="button" aria-pressed="false" data-view="cal">달력</button></div>
        </div>
        <ul class="rows tasks" data-view-panel="list" id="task-list"></ul>
        <div class="cal" data-view-panel="cal" hidden>
          <div class="cal-head"><b id="cal-title"></b></div>
          <div class="cal-grid" id="cal-grid"></div>
          <p class="cal-note" id="cal-note"></p>
        </div>
      </div>
    </section>
  </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="/js/routes.js" th:src="@{/js/routes.js}"></script>
<script src="/js/common.js" th:src="@{/js/common.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/ds-ui.js" th:src="@{/js/ds-ui.js}"></script>
<script src="/js/dashboard.js" th:src="@{/js/dashboard.js}"></script>
</body>
</html>
