<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이디 찾기 — JobPuzzle</title>
<th:block th:replace="~{fragments/head :: dsCss}"></th:block>
<link rel="stylesheet" href="/css/ds/auth.css" th:href="@{/css/ds/auth.css}">
</head>
<body>

<div th:replace="~{fragments/header :: landingHeader}"></div>

<main class="auth-main">
  <section class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__logo"><img src="/images/logo-j-white.png" th:src="@{/images/logo-j-white.png}" alt=""></div>
      <h1 class="auth-card__title">아이디 찾기</h1>
      <p class="auth-card__subtitle">가입할 때 쓴 이메일로 인증 코드를 보내드려요</p>

      <div class="auth-form" id="find-id-form">
        <div class="auth-error" id="find-id-error" role="alert"></div>
        <div class="auth-field" id="email-step">
          <label for="email">이메일</label>
          <div class="auth-row">
            <input class="auth-input" type="email" id="email" name="email" autocomplete="email" placeholder="example@email.com" required>
            <button class="auth-sub-btn" type="button" id="send-code-btn">인증코드 발송</button>
          </div>
          <span class="auth-hint field-hint" id="send-hint"></span>
        </div>
        <div class="auth-field" id="code-step" hidden>
          <label for="code">인증 코드</label>
          <div class="auth-row">
            <input class="auth-input" type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6자리 숫자" required>
            <button class="auth-sub-btn" type="button" id="verify-btn">확인</button>
          </div>
          <span class="auth-hint">이메일로 받은 6자리 코드를 3분 안에 입력해주세요.</span>
        </div>
      </div>

      <div id="find-id-result" hidden>
        <div class="auth-result">
          <span class="auth-result__icon"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <p>가입한 아이디예요</p>
          <strong id="result-login-id"></strong>
        </div>
        <div class="auth-actions">
          <a class="auth-submit" href="/jobpuzzle/login" th:href="@{/login}">로그인하러 가기</a>
          <a class="auth-sub-link" href="/jobpuzzle/passwd-reset" th:href="@{/passwd-reset}">비밀번호 재설정</a>
        </div>
      </div>

      <p class="auth-foot auth-foot--sub"><a href="/jobpuzzle/passwd-reset" th:href="@{/passwd-reset}">비밀번호를 잊으셨나요?</a> · <a href="/jobpuzzle/login" th:href="@{/login}">로그인으로 돌아가기</a></p>
    </div>
  </section>
</main>

<script src="/js/routes.js" th:src="@{/js/routes.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/find-id.js" th:src="@{/js/find-id.js}"></script>
</body>
</html>
