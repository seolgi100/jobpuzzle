<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- 공통 푸터 — 기준: DESIGN-SYSTEM.md 5장 "로고" (푸터는 J 심볼 + 잡퍼즐) -->
<footer th:fragment="siteFooter"
        class="site-footer">
    <div class="site-footer__inner">
        <a class="site-footer__brand" href="/jobpuzzle/" th:href="@{/}" aria-label="잡퍼즐 처음으로">
            <svg viewBox="0 0 220 300" aria-hidden="true">
                <defs>
                    <path id="jp-footer-piece" d="M30 20 H130 V55 A17 17 0 1 1 130 85 V120 H95 A15 15 0 0 0 65 120 H30 V85 A17 17 0 1 1 30 55 Z"/>
                    <mask id="jp-footer-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="220" height="300">
                        <rect width="220" height="300" fill="#fff"/>
                        <use href="#jp-footer-piece" fill="#000" transform="translate(46 150) scale(.7)"/>
                        <rect x="96" y="140" width="10" height="34" fill="#000"/>
                    </mask>
                </defs>
                <path mask="url(#jp-footer-cut)" fill="currentColor" d="M105 50 L214 0 V192 A107 107 0 0 1 0 192 V140 H106 Z"/>
            </svg>
            <span>잡퍼즐</span>
        </a>
        <span>© 잡퍼즐</span>
        <span>이용약관</span>
        <span>개인정보처리방침</span>
    </div>
</footer>

</body>
</html>
