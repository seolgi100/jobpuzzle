<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 — JobPuzzle</title>
<th:block th:replace="~{fragments/head :: dsCss}"></th:block>
<link rel="stylesheet" href="/css/ds/auth.css" th:href="@{/css/ds/auth.css}">
</head>
<body>

<div th:replace="~{fragments/header :: landingHeader}"></div>

<main class="auth-main">
  <section class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__logo"><img src="/images/logo-j-white.png" th:src="@{/images/logo-j-white.png}" alt=""></div>
      <h1 class="auth-card__title">회원가입</h1>
      <p class="auth-card__subtitle">몇 가지 정보만 입력하면 바로 시작할 수 있어요</p>

      <form class="auth-form" id="join-form" novalidate>
        <div class="auth-error" id="join-error" role="alert"></div>

        <div class="auth-group">
          <p class="auth-group__title"><b>1</b>계정 정보</p>
          <div class="auth-field">
            <label for="loginId">아이디</label>
            <div class="auth-row">
              <input class="auth-input" type="text" id="loginId" name="loginId" autocomplete="username" placeholder="아이디를 입력해주세요" required>
              <button class="auth-sub-btn" type="button" id="check-id-btn">중복확인</button>
            </div>
            <span class="auth-hint field-hint" id="loginId-hint"></span>
          </div>
          <div class="auth-field">
            <label for="password">비밀번호</label>
            <input class="auth-input" type="password" id="password" name="password" autocomplete="new-password" placeholder="영문, 숫자를 포함해 8~20자" required>
            <span class="auth-hint field-hint" id="password-hint"></span>
          </div>
          <div class="auth-field">
            <label for="passwordCheck">비밀번호 확인</label>
            <input class="auth-input" type="password" id="passwordCheck" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력해주세요" required>
            <span class="auth-hint field-hint" id="passwordCheck-hint"></span>
          </div>
        </div>

        <div class="auth-group">
          <p class="auth-group__title"><b>2</b>본인 확인</p>
          <div class="auth-field">
            <label for="name">이름</label>
            <input class="auth-input" type="text" id="name" name="name" autocomplete="name" placeholder="이름을 입력해주세요" required>
            <span class="auth-hint field-hint" id="name-hint"></span>
          </div>
          <div class="auth-field">
            <label for="email">이메일</label>
            <div class="auth-row">
              <input class="auth-input" type="email" id="email" name="email" autocomplete="email" placeholder="이메일을 입력해주세요" required>
              <button class="auth-sub-btn" type="button" id="send-email-code-btn">인증코드 발송</button>
            </div>
            <span class="auth-hint field-hint" id="email-hint"></span>
          </div>
          <div class="auth-field" id="email-code-step" hidden>
            <label for="emailCode">인증 코드</label>
            <div class="auth-row">
              <input class="auth-input" type="text" id="emailCode" name="emailCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6자리 숫자" required>
              <button class="auth-sub-btn" type="button" id="verify-email-code-btn">확인</button>
            </div>
            <span class="auth-hint" id="email-code-hint">이메일로 받은 6자리 코드를 <strong id="email-code-countdown">3:00</strong> 안에 입력해주세요.</span>
          </div>
        </div>

        <div class="auth-group">
          <p class="auth-group__title"><b>3</b>관심 직무</p>
          <div class="auth-cols">
            <div class="auth-field"><label for="mainCategory">대분류</label>
              <select class="auth-input" id="mainCategory" name="mainCategory" required><option value="">선택</option></select></div>
            <div class="auth-field"><label for="subCategory">중분류</label>
              <select class="auth-input" id="subCategory" name="subCategory" required disabled><option value="">대분류 먼저</option></select></div>
            <div class="auth-field"><label for="careerLevel">경력</label>
              <select class="auth-input" id="careerLevel" name="careerLevel" required disabled><option value="">중분류 먼저</option></select></div>
          </div>
          <span class="auth-hint" id="jobCategory-hint">관심 직무에 맞춰 분석 기준과 면접 질문이 정해져요.</span>
        </div>

        <button class="auth-submit" type="submit">가입하고 시작하기</button>
      </form>

      <p class="auth-foot">이미 계정이 있으신가요? <a href="/jobpuzzle/login" th:href="@{/login}">로그인</a></p>
    </div>
  </section>
</main>

<script src="/js/routes.js" th:src="@{/js/routes.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/join.js" th:src="@{/js/join.js}"></script>
</body>
</html>
