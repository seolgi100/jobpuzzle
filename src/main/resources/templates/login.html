<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — JobPuzzle</title>
<th:block th:replace="~{fragments/head :: dsCss}"></th:block>
<link rel="stylesheet" href="/css/ds/auth.css" th:href="@{/css/ds/auth.css}">
</head>
<body>

<div th:replace="~{fragments/header :: landingHeader}"></div>

<main class="auth-main">
  <section class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__logo"><img src="/images/logo-j-white.png" th:src="@{/images/logo-j-white.png}" alt=""></div>
      <h1 class="auth-card__title">로그인</h1>
      <p class="auth-card__subtitle">JobPuzzle과 함께 취업 준비를 이어가세요</p>

      <form class="auth-form" id="login-form" novalidate>
        <div class="auth-error" id="login-error" role="alert"></div>
        <div class="auth-field">
          <label for="loginId">아이디</label>
          <input class="auth-input" type="text" id="loginId" name="loginId" autocomplete="username" placeholder="아이디를 입력해주세요" required>
        </div>
        <div class="auth-field">
          <label for="password">비밀번호</label>
          <input class="auth-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호를 입력해주세요" required>
        </div>
        <div class="auth-options">
          <label class="auth-check"><input type="checkbox" id="autoLogin">자동로그인</label>
          <div class="auth-links">
            <a href="/jobpuzzle/find-id" th:href="@{/find-id}">아이디 찾기</a>
            <a href="/jobpuzzle/passwd-reset" th:href="@{/passwd-reset}">비밀번호 재설정</a>
          </div>
        </div>
        <button class="auth-submit" type="submit">로그인</button>
      </form>

      <div class="auth-divider">또는</div>
      <div class="auth-social">
        <a class="auth-social__kakao" href="/jobpuzzle/oauth2/authorization/kakao" th:href="@{/oauth2/authorization/kakao}"><img src="/images/kakao_logo.png" th:src="@{/images/kakao_logo.png}" alt="">카카오로 시작하기</a>
        <a class="auth-social__google" href="/jobpuzzle/oauth2/authorization/google" th:href="@{/oauth2/authorization/google}"><img src="/images/google_logo.png" th:src="@{/images/google_logo.png}" alt="">구글로 시작하기</a>
      </div>

      <p class="auth-foot">아직 회원이 아니신가요? <a href="/jobpuzzle/join" th:href="@{/join}">회원가입</a></p>
      <p class="auth-foot auth-foot--sub"><a href="/jobpuzzle/unlock" th:href="@{/unlock}">계정이 잠기셨나요?</a></p>
    </div>
  </section>
</main>

<script src="/js/routes.js" th:src="@{/js/routes.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/login.js" th:src="@{/js/login.js}"></script>
</body>
</html>
