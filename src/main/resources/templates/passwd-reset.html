<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 — JobPuzzle</title>
<th:block th:replace="~{fragments/head :: dsCss}"></th:block>
<link rel="stylesheet" href="/css/ds/auth.css" th:href="@{/css/ds/auth.css}">
</head>
<body>

<div th:replace="~{fragments/header :: landingHeader}"></div>

<main class="auth-main">
  <section class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__logo"><img src="/images/logo-j-white.png" th:src="@{/images/logo-j-white.png}" alt=""></div>
      <h1 class="auth-card__title">비밀번호 재설정</h1>
      <p class="auth-card__subtitle">본인 확인을 마치면 새 비밀번호를 정할 수 있어요</p>

      <div class="auth-steps" id="reset-steps"><span class="is-now" data-step="1">1 본인 확인</span><span data-step="2">2 새 비밀번호</span></div>
      <div class="auth-error" id="passwd-reset-error" role="alert"></div>

      <div class="auth-form" id="info-form">
        <div class="auth-field" id="info-step">
          <label for="loginId">아이디</label>
          <input class="auth-input" type="text" id="loginId" name="loginId" autocomplete="username" placeholder="아이디를 입력해주세요" required>
        </div>
        <div class="auth-field">
          <label for="email">이메일</label>
          <div class="auth-row">
            <input class="auth-input" type="email" id="email" name="email" autocomplete="email" placeholder="가입할 때 쓴 이메일" required>
            <button class="auth-sub-btn" type="button" id="send-code-btn">인증코드 발송</button>
          </div>
          <span class="auth-hint field-hint" id="send-hint"></span>
        </div>
        <div class="auth-field" id="code-step" hidden>
          <label for="code">인증 코드</label>
          <div class="auth-row">
            <input class="auth-input" type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6자리 숫자" required>
            <button class="auth-sub-btn" type="button" id="verify-btn">확인</button>
          </div>
          <span class="auth-hint" id="code-hint">이메일로 받은 6자리 코드를 <strong id="countdown">3:00</strong> 안에 입력해주세요.</span>
        </div>
      </div>

      <div class="auth-form" id="password-step" hidden>
        <div class="auth-field">
          <label for="newPassword">새 비밀번호</label>
          <input class="auth-input" type="password" id="newPassword" name="newPassword" autocomplete="new-password" placeholder="영문, 숫자를 포함해 8~20자" required>
        </div>
        <div class="auth-field">
          <label for="newPasswordCheck">새 비밀번호 확인</label>
          <input class="auth-input" type="password" id="newPasswordCheck" autocomplete="new-password" placeholder="새 비밀번호를 한 번 더 입력해주세요" required>
        </div>
        <button class="auth-submit" type="button" id="reset-btn">비밀번호 변경</button>
      </div>

      <div id="passwd-reset-result" hidden>
        <div class="auth-result">
          <span class="auth-result__icon"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <strong>비밀번호를 바꿨어요</strong>
          <p>새 비밀번호로 다시 로그인해주세요.</p>
        </div>
        <div class="auth-actions"><a class="auth-submit" href="/jobpuzzle/login" th:href="@{/login}">로그인하러 가기</a></div>
      </div>

      <p class="auth-foot auth-foot--sub"><a href="/jobpuzzle/find-id" th:href="@{/find-id}">아이디를 잊으셨나요?</a> · <a href="/jobpuzzle/login" th:href="@{/login}">로그인으로 돌아가기</a></p>
    </div>
  </section>
</main>

<script src="/js/routes.js" th:src="@{/js/routes.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/passwd-reset.js" th:src="@{/js/passwd-reset.js}"></script>
</body>
</html>
